# =====================================================================
# Nginx — API Gateway / reverse proxy for the World Cup log project
#
# This is a FULL nginx.conf (it contains the events{} and http{} blocks),
# so it must be mounted at /etc/nginx/nginx.conf — NOT into conf.d/.
#
# Every request from the traffic generator enters here and is routed to
# the matching backend service. Nginx writes the gateway-level access log
# (nginx_access.log) which is the input of the general MapReduce analyses.
# =====================================================================

events {
    worker_connections 4096;
}

http {
    # ---- upstreams: names come from docker-compose.yml service names -----
    upstream match_service_upstream {
        server match-service:8000;
        keepalive 32;
    }

    upstream team_service_upstream {
        server team-service:8000;
        keepalive 32;
    }

    upstream stadium_service_upstream {
        server stadium-service:8000;
        keepalive 32;
    }

    # ---- structured JSON Lines access log --------------------------------
    # escape=json makes every value safe for JSON output.
    # $status is numeric on purpose; $request_time is kept as a string,
    # exactly as required by the project spec (section 7.1).
    log_format json_logs escape=json
        '{"timestamp":"$time_iso8601",'
        '"request_id":"$http_x_request_id",'
        '"client_ip":"$remote_addr",'
        '"client_country":"$http_x_client_country",'
        '"scenario":"$http_x_scenario",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"service":"$target_service",'
        '"status_code":$status,'
        '"request_time_sec":"$request_time",'
        '"user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/nginx_access.log json_logs;
    error_log  /var/log/nginx/nginx_error.log warn;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # Default value so the "service" log field is never empty for
        # requests that do not match any location block.
        set $target_service "unknown";

        # ---------------- match-service ----------------
        location /api/matches {
            set $target_service "match-service";
            proxy_pass http://match_service_upstream;

            proxy_set_header X-Request-ID      $http_x_request_id;
            proxy_set_header X-Client-Country  $http_x_client_country;
            proxy_set_header X-Scenario        $http_x_scenario;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_read_timeout 30s;
        }

        # ---------------- team-service -----------------
        location /api/teams {
            set $target_service "team-service";
            proxy_pass http://team_service_upstream;

            proxy_set_header X-Request-ID      $http_x_request_id;
            proxy_set_header X-Client-Country  $http_x_client_country;
            proxy_set_header X-Scenario        $http_x_scenario;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_read_timeout 30s;
        }

        # ---------------- stadium-service --------------
        location /api/stadiums {
            set $target_service "stadium-service";
            proxy_pass http://stadium_service_upstream;

            proxy_set_header X-Request-ID      $http_x_request_id;
            proxy_set_header X-Client-Country  $http_x_client_country;
            proxy_set_header X-Scenario        $http_x_scenario;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_read_timeout 30s;
        }

        # Gateway health check (not proxied anywhere)
        location = /health {
            set $target_service "nginx";
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"nginx-gateway"}';
        }

        # Anything else -> 404 at the gateway, still logged with
        # service = "unknown" thanks to the server-level default above.
        location / {
            add_header Content-Type application/json;
            return 404 '{"error":"unknown route"}';
        }
    }
}
